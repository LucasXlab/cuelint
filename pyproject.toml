[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuelint"
version = "0.1.0"
description = "Local subtitle quality checker and fixer for SRT and WebVTT"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CueLint contributors" }]
keywords = ["subtitles", "srt", "webvtt", "captions", "accessibility", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]

[project.scripts]
cuelint = "cuelint.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
