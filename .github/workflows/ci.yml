name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Smoke test
        run: |
          cuelint --version
          cuelint check examples/demo.zh.srt || test $? -eq 1

  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version matches tag
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          tag = "${{ github.ref_name }}".lstrip("v")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          init = Path("src/cuelint/__init__.py").read_text()
          assert pyproject["project"]["version"] == tag, (pyproject["project"]["version"], tag)
          assert f'__version__ = "{tag}"' in init
          print("version ok:", tag)
          PY
      - name: Test and build
        run: |
          python -m pip install -e '.[test]' build
          python -m pytest
          python -m build --sdist --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
